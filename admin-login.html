<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access | getplayiptv</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Raleway', sans-serif; }
    body { background: linear-gradient(135deg, #06162F 0%, #0A1B3D 100%); }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#091936]/90 p-6 shadow-2xl shadow-black/30 backdrop-blur">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#F5F7FA] p-2">
          <img src="Gemini_Generated_Image_8xu4qp8xu4qp8xu4.png" alt="getplayiptv logo" class="h-full w-full object-contain">
        </div>
        <h1 class="text-2xl font-extrabold">Admin Access</h1>
        <p class="mt-2 text-sm text-white/60">Sign in or create an admin account with your email and password.</p>
      </div>

      <div class="mb-5 flex rounded-xl border border-white/10 bg-white/5 p-1">
        <button type="button" id="login-tab" class="mode-tab flex-1 rounded-lg bg-[#D4AF37] px-3 py-2 text-sm font-semibold text-[#06162F]">Login</button>
        <button type="button" id="register-tab" class="mode-tab flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-white/70">Register</button>
      </div>

      <form id="auth-form" class="space-y-4">
        <label class="block text-sm font-semibold text-white/80">
          Email
          <input id="email" type="email" required placeholder="admin@example.com" class="mt-2 w-full rounded-lg border border-white/10 bg-[#06162F] px-3 py-3 text-sm text-white outline-none placeholder:text-white/30 focus:border-[#D4AF37]/60">
        </label>

        <label class="block text-sm font-semibold text-white/80">
          Password
          <input id="password" type="password" required minlength="6" placeholder="••••••••" class="mt-2 w-full rounded-lg border border-white/10 bg-[#06162F] px-3 py-3 text-sm text-white outline-none placeholder:text-white/30 focus:border-[#D4AF37]/60">
        </label>

        <label id="confirm-wrap" class="hidden block text-sm font-semibold text-white/80">
          Confirm Password
          <input id="confirm-password" type="password" placeholder="Repeat your password" class="mt-2 w-full rounded-lg border border-white/10 bg-[#06162F] px-3 py-3 text-sm text-white outline-none placeholder:text-white/30 focus:border-[#D4AF37]/60">
        </label>

        <button type="submit" id="submit-button" class="w-full rounded-lg bg-[#D4AF37] px-4 py-3 text-sm font-bold text-[#06162F] transition hover:bg-[#b8952b]">
          Sign in
        </button>
      </form>

      <p id="auth-message" class="mt-4 text-center text-sm text-white/60"></p>
      <p class="mt-4 text-center text-xs text-white/40">
        Back to <a href="index.html" class="text-[#D4AF37] hover:underline">website</a>
      </p>
    </div>
  </div>

  <script>
    const supabaseConfig = window.SUPABASE_CONFIG || {};
    const isSupabaseConfigured = supabaseConfig.url && !supabaseConfig.url.includes('YOUR_PROJECT_REF') && supabaseConfig.anonKey && !supabaseConfig.anonKey.includes('YOUR_');
    const supabaseClient = isSupabaseConfigured ? window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey) : null;
    // admin credentials removed for privacy — do not hard-code secrets in files

    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const confirmWrap = document.getElementById('confirm-wrap');
    const authForm = document.getElementById('auth-form');
    const submitButton = document.getElementById('submit-button');
    const authMessage = document.getElementById('auth-message');
    const emailField = document.getElementById('email');
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm-password');

    let mode = 'login';

    function setMode(nextMode) {
      mode = nextMode;
      const isRegister = nextMode === 'register';
      confirmWrap.classList.toggle('hidden', !isRegister);
      loginTab.classList.toggle('bg-[#D4AF37]', nextMode === 'login');
      loginTab.classList.toggle('text-[#06162F]', nextMode === 'login');
      loginTab.classList.toggle('text-white/70', nextMode !== 'login');
      registerTab.classList.toggle('bg-[#D4AF37]', nextMode === 'register');
      registerTab.classList.toggle('text-[#06162F]', nextMode === 'register');
      registerTab.classList.toggle('text-white/70', nextMode !== 'register');
      submitButton.textContent = isRegister ? 'Create account' : 'Sign in';
      authMessage.textContent = '';
      if (isRegister) {
        confirmField.required = true;
      } else {
        confirmField.required = false;
      }
    }

    function saveSession(email) {
      localStorage.setItem('getplayiptv-admin-session', JSON.stringify({ email, updatedAt: Date.now() }));
      localStorage.setItem('getplayiptv-admin-user', email);
    }

    // preset autofill removed to protect personal information

    function showMessage(text, isError = false) {
      authMessage.textContent = text;
      authMessage.className = `mt-4 text-center text-sm ${isError ? 'text-rose-300' : 'text-emerald-300'}`;
    }

    async function checkExistingSession() {
      const savedSession = JSON.parse(localStorage.getItem('getplayiptv-admin-session') || 'null');
      if (savedSession?.email) {
        window.location.replace('admin.html');
        return;
      }

      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user?.email) {
          saveSession(session.user.email);
          window.location.replace('admin.html');
        }
      } catch (error) {
        console.error(error);
      }
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      const email = emailField.value.trim();
      const password = passwordField.value;
      const confirmPassword = confirmField.value;

      if (!email || !password) {
        showMessage('Please fill in both fields.', true);
        return;
      }

      if (mode === 'register' && password !== confirmPassword) {
        showMessage('Passwords do not match.', true);
        return;
      }

      // no local hard-coded credential shortcuts — proceed with regular auth flow

      try {
        if (supabaseClient) {
          let result;
          if (mode === 'register') {
            result = await supabaseClient.auth.signUp({ email, password });
          } else {
            result = await supabaseClient.auth.signInWithPassword({ email, password });
          }

          if (result.error) throw result.error;
        }

        saveSession(email);
        showMessage(mode === 'register' ? 'Account ready. Redirecting to the admin panel...' : 'Login successful. Redirecting...');
        setTimeout(() => window.location.replace('admin.html'), 700);
      } catch (error) {
        console.error(error);
        const message = error?.message || 'Authentication failed.';
        showMessage(message, true);
      }
    });

    setMode('login');
    checkExistingSession();
  </script>
</body>
</html>
