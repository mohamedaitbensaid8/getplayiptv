<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06162f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="getplayiptv is temporarily under maintenance. We will be back soon.">
  <title>Maintenance en cours | getplayiptv</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #041126;
      color: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0, rgba(26, 74, 137, .42), transparent 58%),
        linear-gradient(145deg, #06162f, #030b19 72%);
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      border: 1px solid rgba(212, 175, 55, .28);
      border-radius: 28px;
      background: rgba(7, 27, 54, .82);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .34);
    }

    .brand {
      margin: 0 0 34px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .brand span { color: #d4af37; }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(212, 175, 55, .38);
      border-radius: 24px;
      background: rgba(212, 175, 55, .1);
      color: #e5c45d;
    }

    .icon svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      color: #e5c45d;
      font-size: clamp(1.65rem, 5vw, 2.3rem);
      line-height: 1.25;
    }

    .message {
      min-height: 5.5em;
      margin: 18px 0 28px;
      color: rgba(245, 247, 250, .78);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .language-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .language-switch button {
      min-width: 76px;
      padding: 9px 15px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .04);
      color: rgba(245, 247, 250, .72);
      font: inherit;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      border-color: #d4af37;
      background: rgba(212, 175, 55, .12);
      color: #f1d776;
    }

    .contact {
      color: rgba(245, 247, 250, .58);
      font-size: .9rem;
    }

    .contact a {
      color: #e5c45d;
      text-decoration: none;
    }

    .contact a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: no-preference) {
      .icon svg { animation: turn 7s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">getplay<span>iptv</span></p>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.64 5.64l2.12 2.12m8.48 8.48 2.12 2.12m0-12.72-2.12 2.12m-8.48 8.48-2.12 2.12"/>
        <circle cx="12" cy="12" r="5"/>
      </svg>
    </div>
    <h1 id="title">Maintenance en cours</h1>
    <p class="message" id="message">Nous effectuons actuellement des réparations et des améliorations sur le site. Nous serons de retour bientôt. Merci de votre compréhension.</p>
    <nav class="language-switch" aria-label="Choisir la langue">
      <button type="button" data-language="fr" aria-pressed="true">FR</button>
      <button type="button" data-language="en" aria-pressed="false">EN</button>
      <button type="button" data-language="ar" aria-pressed="false">AR</button>
    </nav>
    <p class="contact" id="contact">Besoin d'aide ? <a href="mailto:getplayiptv@gmail.com">getplayiptv@gmail.com</a></p>
  </main>
  <script>
    const copy = {
      fr: {
        title: 'Maintenance en cours',
        message: 'Nous effectuons actuellement des réparations et des améliorations sur le site. Nous serons de retour bientôt. Merci de votre compréhension.',
        contact: "Besoin d'aide ?",
        languageLabel: 'Choisir la langue'
      },
      en: {
        title: 'We’ll be back soon',
        message: 'We are currently carrying out repairs and improvements to the website. We will be back soon. Thank you for your understanding.',
        contact: 'Need help?',
        languageLabel: 'Choose language'
      },
      ar: {
        title: 'الموقع قيد الصيانة',
        message: 'نقوم حالياً بإصلاحات وتحسينات على الموقع. سنعود قريباً. شكراً على تفهمكم.',
        contact: 'تحتاج إلى مساعدة؟',
        languageLabel: 'اختيار اللغة'
      }
    };

    function setLanguage(language) {
      const selected = copy[language] ? language : 'fr';
      const content = copy[selected];
      document.documentElement.lang = selected;
      document.documentElement.dir = selected === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('title').textContent = content.title;
      document.getElementById('message').textContent = content.message;
      document.getElementById('contact').firstChild.textContent = `${content.contact} `;
      document.querySelector('.language-switch').setAttribute('aria-label', content.languageLabel);
      document.querySelectorAll('[data-language]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.language === selected));
      });
    }

    document.querySelectorAll('[data-language]').forEach(button => {
      button.addEventListener('click', () => setLanguage(button.dataset.language));
    });

    setLanguage('fr');
  </script>
</body>
</html>
